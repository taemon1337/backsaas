version: 1
service:
  name: "platform"
  description: "BackSaas Platform Management API"

entities:
  tenants:
    key: "tenant_id"
    schema:
      type: "object"
      required: ["tenant_id", "name", "slug", "owner_email"]
      properties:
        tenant_id:
          type: "string"
          description: "Unique identifier for the tenant"
        name:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "Display name for the tenant"
        slug:
          type: "string"
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9-]+$"
          description: "URL-friendly identifier for the tenant"
        domain:
          type: "string"
          format: "hostname"
          description: "Custom domain for the tenant"
        plan:
          type: "string"
          enum: ["starter", "pro", "enterprise", "system"]
          default: "starter"
          description: "Subscription plan"
        status:
          type: "string"
          enum: ["active", "inactive", "suspended", "trial"]
          default: "active"
          description: "Current status of the tenant"
        owner_email:
          type: "string"
          format: "email"
          description: "Primary contact email for the tenant owner"
        owner_name:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "Full name of the tenant owner"
        user_count:
          type: "integer"
          minimum: 0
          default: 0
          description: "Number of users in this tenant"
        storage_used:
          type: "string"
          description: "Amount of storage used (e.g., '1.2 GB')"
        last_activity:
          type: "string"
          format: "date-time"
          description: "Timestamp of last activity in this tenant"
        billing_status:
          type: "string"
          enum: ["paid", "trial", "overdue", "suspended"]
          default: "trial"
          description: "Current billing status"
        created_at:
          type: "string"
          format: "date-time"
          description: "When the tenant was created"
        updated_at:
          type: "string"
          format: "date-time"
          description: "When the tenant was last updated"
        settings:
          type: "object"
          description: "Tenant-specific configuration settings"

  users:
    key: "user_id"
    schema:
      type: "object"
      required: ["user_id", "email", "tenant_id"]
      properties:
        user_id:
          type: "string"
          description: "Unique identifier for the user"
        tenant_id:
          type: "string"
          description: "Tenant this user belongs to"
        email:
          type: "string"
          format: "email"
          description: "User's email address"
        first_name:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "User's first name"
        last_name:
          type: "string"
          minLength: 1
          maxLength: 100
          description: "User's last name"
        role:
          type: "string"
          enum: ["platform_admin", "admin", "user"]
          default: "user"
          description: "User's role within the tenant"
        status:
          type: "string"
          enum: ["active", "inactive", "pending"]
          default: "pending"
          description: "Current status of the user account"

  schemas:
    key: "schema_id"
    schema:
      type: "object"
      required: ["schema_id", "name", "schema_definition"]
      properties:
        schema_id:
          type: "string"
          description: "Unique identifier for the schema"
        name:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "Name of the schema"
        slug:
          type: "string"
          minLength: 1
          maxLength: 100
          pattern: "^[a-z0-9-]+$"
          description: "URL-friendly identifier for the schema"
        description:
          type: "string"
          maxLength: 1000
          description: "Description of what this schema represents"
        type:
          type: "string"
          enum: ["entity", "collection", "workflow", "event"]
          default: "entity"
          description: "Type/category of the schema"
        status:
          type: "string"
          enum: ["draft", "active", "deprecated", "archived"]
          default: "draft"
          description: "Current status of the schema"
        version:
          type: "string"
          pattern: "^\\d+\\.\\d+\\.\\d+$"
          default: "1.0.0"
          description: "Semantic version of the schema"
        field_count:
          type: "integer"
          minimum: 0
          default: 0
          description: "Number of fields in the schema"
        usage_count:
          type: "integer"
          minimum: 0
          default: 0
          description: "Number of times this schema has been used"
        schema_definition:
          type: "object"
          description: "The actual schema definition in JSON format"
        tags:
          type: "array"
          items:
            type: "string"
          description: "Tags for categorizing and searching schemas"
        created_at:
          type: "string"
          format: "date-time"
          description: "When the schema was created"
        updated_at:
          type: "string"
          format: "date-time"
          description: "When the schema was last updated"
        created_by:
          type: "string"
          description: "User ID who created the schema"

  api_keys:
    key: "key_id"
    schema:
      type: "object"
      required: ["key_id", "tenant_id", "user_id", "name"]
      properties:
        key_id:
          type: "string"
          description: "Unique identifier for the API key"
        tenant_id:
          type: "string"
          description: "Tenant this API key belongs to"
        user_id:
          type: "string"
          description: "User who owns this API key"
        name:
          type: "string"
          minLength: 1
          maxLength: 255
          description: "Descriptive name for the API key"
        permissions:
          type: "array"
          items:
            type: "string"
          description: "List of permissions granted to this API key"
        expires_at:
          type: "string"
          format: "date-time"
          description: "When the API key expires (null for no expiration)"
        last_used:
          type: "string"
          format: "date-time"
          description: "When the API key was last used"
